<svg width="760" height="260" viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="J.A.R.V.I.S. boot terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C6AF7"/>
      <stop offset="100%" stop-color="#a594ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- janela do terminal -->
  <rect x="1" y="1" width="758" height="258" rx="14" fill="url(#bg)" stroke="#7C6AF7" stroke-width="1.5" opacity="0.95"/>

  <!-- barra de titulo -->
  <rect x="1" y="1" width="758" height="34" rx="14" fill="#1a1730" opacity="0.6"/>
  <circle cx="26" cy="18" r="5" fill="#FF6B35"/>
  <circle cx="46" cy="18" r="5" fill="#7C6AF7"/>
  <circle cx="66" cy="18" r="5" fill="#a594ff"/>
  <text x="380" y="22" font-family="JetBrains Mono, monospace" font-size="12" fill="#a0a0c0" text-anchor="middle">jarvis@danilo — bash</text>

  <!-- reator arc (nucleo animado) -->
  <g transform="translate(690, 145)" filter="url(#glow)">
    <circle r="30" fill="none" stroke="#7C6AF7" stroke-width="1" opacity="0.3"/>
    <circle r="22" fill="none" stroke="url(#arc)" stroke-width="2" opacity="0.7">
      <animate attributeName="r" values="22;25;22" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="url(#arc)">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#a594ff" stroke-width="2" opacity="0.8">
      <line x1="0" y1="-18" x2="0" y2="-14"/>
      <line x1="0" y1="18" x2="0" y2="14"/>
      <line x1="-18" y1="0" x2="-14" y2="0"/>
      <line x1="18" y1="0" x2="14" y2="0"/>
    </g>
    <circle r="40" fill="none" stroke="#7C6AF7" stroke-width="0.5" opacity="0.4" stroke-dasharray="4 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- linhas de boot do terminal -->
  <g font-family="JetBrains Mono, monospace" font-size="13" fill="#c9d1d9">
    <text x="28" y="68" opacity="0">
      <tspan fill="#7C6AF7">$</tspan> initializing J.A.R.V.I.S...
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="28" y="94" fill="#a594ff" opacity="0">
      [ OK ] Sistemas online — Desenvolvedor Full Stack
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.0s" fill="freeze"/>
    </text>
    <text x="28" y="120" fill="#a594ff" opacity="0">
      [ OK ] Carregando stack: TS · Java · Kotlin · Python
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
    </text>
    <text x="28" y="146" fill="#a594ff" opacity="0">
      [ OK ] Reator de codigo: ESTAVEL ⚡
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.6s" fill="freeze"/>
    </text>
    <text x="28" y="180" font-size="15" fill="#ffffff" font-weight="600" opacity="0">
      <tspan fill="#7C6AF7">›</tspan> "Escreva codigo que fale por si mesmo."
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.4s" fill="freeze"/>
    </text>
    <text x="28" y="212" font-size="12" fill="#a0a0c0" opacity="0">
      <tspan fill="#FF6B35">$</tspan> aguardando proxima missao
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="4.2s" fill="freeze"/>
      <tspan fill="#7C6AF7">_</tspan>
    </text>
    <!-- cursor piscando -->
    <rect x="232" y="202" width="8" height="14" fill="#7C6AF7" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" dur="1s" begin="4.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
